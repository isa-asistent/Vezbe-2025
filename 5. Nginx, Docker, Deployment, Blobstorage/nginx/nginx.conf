worker_processes 1;

events {
    worker_connections 1024;
}

http {
    include mime.types;
    default_type application/octet-stream;

    sendfile on;
    keepalive_timeout 65;
    # objedinjuje sve servere koji su za vozila, pod imenom "carsbackend". Ovo se koristi radi balansiranja opterecenja.
    upstream carsbackend {
        server 127.0.0.1:8086;
        server 127.0.0.1:8087; # second instance, adjust the port
    }

    server {
        # otovori port 8787 gde se nalazi glavna infrastruktura aplikacije
        listen 8787;
        server_name localhost;

        #ruta za aplikaciju o proizvodima. U vasem kodu na front-u, treba da gadjate http://simbolicko_ime_servera/productsapi,
        # umesto direktno http://localhost:8085/ Ako gadjate pravu rutu ovog servera, zaobilazite reverse proxy :(.
        location /productsapi {
            proxy_pass http://localhost:8085/api;

            #definicija dozvoljenih header-a. Ukoliko ovo ne specificirate, nginx ce ih "osisati".
            add_header Access-Control-Allow-Origin *;
            add_header 'Access-Control-Allow-Credentials' 'true' always;
            add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, OPTIONS' always;
            add_header 'Access-Control-Allow-Headers' 'Accept,Authorization,Cache-Control,Content-Type,DNT,If-Modified-Since,Keep-Alive,Origin,User-Agent,X-Requested-With' always;

            proxy_buffering off;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Port $server_port;
        }
        # ruta za aplikaciju o vozilima. U vasem kodu na front-u, treba da gadjate http://simbolicko_ime_servera/carsapi,
        # umesto direktno http://localhost:8086 ili http://localhost:8087. 
        # Kada gadjate ovu rutu, nginx sam radi load balancing i rutiranje zahteva. Ukoliko vam je servis (aplikacija) stateless, ovo je dovoljno
        # za balansiranje opterecenja. Ukoliko sadrzavate neko stanje na pojedinom servisu, neophodna je koordinacija.
       
        location /carsapi {
            
            proxy_pass  http://carsbackend/api;
            add_header Access-Control-Allow-Origin *;
            add_header 'Access-Control-Allow-Credentials' 'true' always;
            add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, OPTIONS' always;
            add_header 'Access-Control-Allow-Headers' 'Accept,Authorization,Cache-Control,Content-Type,DNT,If-Modified-Since,Keep-Alive,Origin,User-Agent,X-Requested-With' always;

            proxy_buffering off;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Port $server_port;
        }

        # ruta za serviranje statickog sadrzaja, u ovom primeru to je UI.
        location / {
            # promeniti na apsolutnu putanju vaseg config-a.
            root "/home/nikola-velemir/ISA-NVT/6. Nginx, Docker, Deployment, Blobstorage/nginx/view";
            index index.html;
        }
        # ruta za serviranje infomracije greske
        error_page 500 502 503 504 /50x.html;
        location = /50x.html {
            root html;
        }
    }
}
