<ul class="divide-y divide-gray-200 overflow-hidden rounded-lg border border-gray-200 bg-white shadow-sm">
  @for (t of sorted(); track t.timeStamp + t.location + t.value) {
    <li class="flex items-center justify-between px-4 py-3">
      <div class="flex flex-col">
        <span
          class="text-lg font-semibold"
          [class.text-blue-600]="t.value < 10"
          [class.text-gray-900]="t.value >= 10 && t.value < 25"
          [class.text-red-600]="t.value >= 25"
        >
          {{ t.value | number: '1.1-1' }} °C
        </span>
        <span class="text-sm text-gray-500">{{ t.location }}</span>
      </div>
      <time class="text-sm text-gray-500">
        {{ t.timeStamp | date: 'medium' }}
      </time>
    </li>
  }
</ul>
